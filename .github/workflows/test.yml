name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl
      - name: Install Quicklisp
        run: |
          curl -fsSLO https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive --load quicklisp.lisp \
            --eval '(quicklisp-quickstart:install)'
      - name: Run tests
        run: |
          sbcl --non-interactive --load ~/quicklisp/setup.lisp \
            --eval '(push (truename ".") asdf:*central-registry*)' \
            --eval '(ql:quickload (list :dct :lisp-unit))' \
            --load src/test.lisp \
            --eval '(let ((r (lisp-unit:run-tests :all :dct-test))) (uiop:quit (if (or (lisp-unit:failed-tests r) (lisp-unit:error-tests r)) 1 0)))'
